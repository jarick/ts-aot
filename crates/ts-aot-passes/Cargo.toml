[package]
name = "ts-aot-passes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Transformation passes for ts-aot (HIR→HIR lowers, HIR→MIR, monomorphize)"

[dependencies]
ts-aot-core = { path = "../ts-aot-core" }
ts-aot-ir-hir = { path = "../ts-aot-ir-hir" }
ts-aot-ir-mir = { path = "../ts-aot-ir-mir" }

[dev-dependencies]
ts-aot-backend = { path = "../ts-aot-backend" }
ts-aot-frontend = { path = "../ts-aot-frontend" }

[lints.clippy]
match_same_arms = "allow"
too_many_arguments = "allow"
only_used_in_recursion = "allow"
module_name_repetitions = "allow"
