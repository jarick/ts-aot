[package]
name = "ts-aot-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Embedded Rust runtime helpers for the ts-aot compiler: Math, console, string ops"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[features]
# Force the host local timezone used by Date getters / offset-free DateTime
# parsing to be UTC, for deterministic SSR builds. Default (without this feature)
# uses TimeZone::system() to match ECMAScript spec semantics. Equivalent to
# deploying with TZ=UTC env var, but baked into the binary.
tz-utc-only = []

[dependencies]
ts-aot-core = { path = "../ts-aot-core" }
indexmap = { workspace = true }
regex = "1"
fastrand = { workspace = true }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
